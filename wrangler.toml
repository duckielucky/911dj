# Only needed if you deploy with the Wrangler CLI instead of the Cloudflare dashboard.
name = "911dj"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "dj911-media"

# Secrets are NOT stored here. Set them in the dashboard, or:
#   npx wrangler pages secret put SITE_PASSWORD
#   npx wrangler pages secret put SESSION_SECRET
